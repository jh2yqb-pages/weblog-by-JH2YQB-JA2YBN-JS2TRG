<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アマチュア無線コンテストログ (WebLog Contest Console)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    .active-tab {
      background-color: #2563eb !important;
      color: #ffffff !important;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl">📻</span>
        <h1 class="text-xl font-bold tracking-wide">WebLog Contest Console</h1>
      </div>
      <div id="authStatus" class="flex items-center gap-3 text-sm">
        <span id="userInfo" class="hidden text-slate-300">ログイン中: <strong id="userName" class="text-white"></strong></span>
        <button id="loginBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded font-medium transition">Googleでログイン</button>
        <button id="logoutBtn" class="hidden bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded transition">ログアウト</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Alert / Toast -->
    <div id="alertBox" class="hidden p-4 rounded-lg text-sm font-medium transition-all shadow"></div>

    <!-- Area & Contest Selector Panel -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">1. エリア・コンテストの選択</h2>
      
      <!-- Area Tabs -->
      <div class="flex flex-wrap gap-1.5 mb-4" id="areaTabs">
        <button onclick="selectArea('national')" id="tab-national" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200 active-tab">全国</button>
        <button onclick="selectArea('2')" id="tab-2" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">2エリア (東海)</button>
        <button onclick="selectArea('1')" id="tab-1" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">1エリア (関東)</button>
        <button onclick="selectArea('3')" id="tab-3" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">3エリア (関西)</button>
        <button onclick="selectArea('4')" id="tab-4" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">4エリア (中国)</button>
        <button onclick="selectArea('5')" id="tab-5" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">5エリア (四国)</button>
        <button onclick="selectArea('6')" id="tab-6" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">6エリア (九州)</button>
        <button onclick="selectArea('7')" id="tab-7" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">7エリア (東北)</button>
        <button onclick="selectArea('8')" id="tab-8" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">8エリア (北海道)</button>
        <button onclick="selectArea('9')" id="tab-9" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">9エリア (北陸)</button>
        <button onclick="selectArea('0')" id="tab-0" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">0エリア (信越)</button>
        <button onclick="selectArea('dx')" id="tab-dx" class="area-tab px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">DX (海外)</button>
      </div>

      <!-- Contest Dropdown & Hint -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
        <div class="md:col-span-2">
          <label for="contestSelect" class="block text-xs font-semibold text-slate-600 mb-1">対象コンテスト</label>
          <select id="contestSelect" onchange="onContestChange()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
          </select>
        </div>
        <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg text-xs text-blue-900">
          <span class="font-bold block mb-0.5">コンテストナンバー形式:</span>
          <span id="exchangeHintText">RS(T) + 市郡/都道府県ナンバー</span>
        </div>
      </div>
    </section>

    <!-- Logging Form -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">2. QSOデータ入力</h2>
      <form id="qsoForm" onsubmit="handleSaveQso(event)" class="space-y-4">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
          
          <!-- Callsign -->
          <div class="col-span-2 sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">相手コールサイン *</label>
            <input type="text" id="callsign" required placeholder="例: JA2YAA" oninput="this.value = this.value.toUpperCase(); checkDupe();" class="w-full border border-slate-300 rounded-lg p-2 font-mono text-base uppercase focus:ring-2 focus:ring-blue-500 outline-none">
            <span id="dupeWarning" class="text-xs text-red-600 font-bold hidden">⚠️ DUPE（交信済み）</span>
          </div>

          <!-- Band -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">周波数 (Band)</label>
            <select id="band" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="1.9MHz">1.9 MHz</option>
              <option value="3.5MHz">3.5 MHz</option>
              <option value="7MHz" selected>7 MHz</option>
              <option value="14MHz">14 MHz</option>
              <option value="21MHz">21 MHz</option>
              <option value="28MHz">28 MHz</option>
              <option value="50MHz">50 MHz</option>
              <option value="144MHz">144 MHz</option>
              <option value="430MHz">430 MHz</option>
              <option value="1200MHz">1200 MHz</option>
              <option value="2400MHz">2400 MHz</option>
            </select>
          </div>

          <!-- Mode -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">モード (Mode)</label>
            <select id="mode" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="CW">CW</option>
              <option value="SSB" selected>SSB</option>
              <option value="FM">FM</option>
              <option value="AM">AM</option>
              <option value="RTTY">RTTY</option>
              <option value="FT8">FT8</option>
              <option value="FT4">FT4</option>
              <option value="D-STAR">D-STAR (DV)</option>
              <option value="C4FM">C4FM</option>
              <option value="DMR">DMR</option>
              <option value="PSK31">PSK31</option>
              <option value="SSTV">SSTV</option>
            </select>
          </div>

          <!-- Sent Exchange -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">送信ナンバー (Sent)</label>
            <input type="text" id="rstSent" placeholder="5959" class="w-full border border-slate-300 rounded-lg p-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- Rcvd Exchange -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">受信ナンバー (Rcvd)</label>
            <input type="text" id="rstRcvd" placeholder="5920M" class="w-full border border-slate-300 rounded-lg p-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

        </div>

        <div class="flex gap-3 justify-end pt-2">
          <button type="button" onclick="resetForm()" class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 rounded-lg font-medium transition">クリア</button>
          <button type="submit" class="px-6 py-2 text-sm bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow transition">QSO登録 (保存)</button>
        </div>
      </form>
    </section>

    <!-- Log List & Actions -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <div>
          <h2 class="text-base font-bold text-slate-800">交信ログ一覧</h2>
          <p class="text-xs text-slate-500">総QSO数: <span id="qsoCount" class="font-bold text-blue-600">0</span> 件</p>
        </div>

        <div class="flex flex-wrap gap-2">
          <button onclick="exportCSV()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 text-white rounded font-medium">CSV出力</button>
          <button onclick="exportCabrillo()" class="px-3 py-1.5 text-xs bg-emerald-700 hover:bg-emerald-600 text-white rounded font-medium">Cabrilloログ生成</button>
          <button onclick="clearAllLogs()" class="px-3 py-1.5 text-xs bg-red-100 hover:bg-red-200 text-red-700 rounded font-medium">全消去</button>
        </div>
      </div>

      <!-- Log Table -->
      <div class="overflow-x-auto border border-slate-200 rounded-lg">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100 border-b border-slate-200 text-slate-600 uppercase">
            <tr>
              <th class="p-2.5">日時 (UTC)</th>
              <th class="p-2.5">Callsign</th>
              <th class="p-2.5">Band</th>
              <th class="p-2.5">Mode</th>
              <th class="p-2.5">Sent</th>
              <th class="p-2.5">Rcvd</th>
              <th class="p-2.5">コンテスト</th>
              <th class="p-2.5 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y divide-slate-100 font-mono">
            <tr>
              <td colspan="8" class="p-4 text-center text-slate-400 font-sans">ログデータがありません</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // --- 1. CONTEST DATABASE (Strictly verified) ---
    const CONTEST_DATABASE = {
      "national": [
        { id: "all_ja", name: "ALL JA コンテスト", hint: "RS(T) + 都道府県振興局ナンバー (例: 5920)" },
        { id: "6m_down", name: "6m AND Down コンテスト", hint: "RS(T) + 市区町村/PMナンバー" },
        { id: "field_day", name: "フィールドデーコンテスト", hint: "RS(T) + 市区町村/PMナンバー" },
        { id: "acag", name: "全市全郡コンテスト", hint: "RS(T) + 市区町村ナンバー" },
        { id: "aadv_cw", name: "ALL ASIAN DX コンテスト (CW)", hint: "RST + オペレータの年齢 (DXはRST+CQ Zone)" },
        { id: "aadv_ph", name: "ALL ASIAN DX コンテスト (Phone)", hint: "RS + オペレータの年齢 (DXはRS+CQ Zone)" }
      ],
      "2": [
        { id: "tokai_qso", name: "東海QSOコンテスト", hint: "RS(T) + 2エリア内市郡/2エリア外都道府県ナンバー" },
        { id: "aichi_expo", name: "愛・地球博記念コンテスト", hint: "RS(T) + オペレータの年齢 (または 01)" },
        { id: "tokai_marathon", name: "東海マラソンコンテスト", hint: "RS(T) + 2エリア内市郡/2エリア外都道府県ナンバー" },
        { id: "mie_33", name: "オール三重33コンテスト", hint: "RS(T) + 三重県内市町ナンバー/県外都府県ナンバー" },
        { id: "shizuoka", name: "静岡コンテスト", hint: "RS(T) + 静岡県内市町ナンバー/県外都府県ナンバー" }
      ],
      "1": [
        { id: "tokyo", name: "東京コンテスト", hint: "RS(T) + 都内区市町村ナンバー/都外都府県ナンバー" },
        { id: "saitama", name: "埼玉コンテスト", hint: "RS(T) + 埼玉県内市郡ナンバー/県外都府県ナンバー" },
        { id: "kanagawa", name: "神奈川コンテスト", hint: "RS(T) + 神奈川県内市郡ナンバー/県外都府県ナンバー" },
        { id: "chiba", name: "千葉コンテスト", hint: "RS(T) + 千葉県内市郡ナンバー/県外都府県ナンバー" }
      ],
      "3": [ { id: "kansai_qso", name: "関西QSOコンテスト", hint: "RS(T) + 府県/市区(郡)ナンバー" } ],
      "4": [ { id: "chugoku", name: "中国QSOコンテスト", hint: "RS(T) + 県/市郡ナンバー" } ],
      "5": [ { id: "shikoku", name: "四国QSOコンテスト", hint: "RS(T) + 県/市郡ナンバー" } ],
      "6": [ { id: "kyushu", name: "九州QSOコンテスト", hint: "RS(T) + 都道府県/市郡ナンバー" } ],
      "7": [ { id: "tohoku", name: "東北QSOコンテスト", hint: "RS(T) + 県/市郡ナンバー" } ],
      "8": [ { id: "hokkaido", name: "道内QSOコンテスト", hint: "RS(T) + 振興局/市郡ナンバー" } ],
      "9": [ { id: "hokuriku", name: "北陸QSOコンテスト", hint: "RS(T) + 県/市郡ナンバー" } ],
      "0": [ { id: "shinshu", name: "信州QSOコンテスト", hint: "RS(T) + 長野県内市郡/県外ナンバー" } ],
      "dx": [
        { id: "cq_ww_cw", name: "CQ WW DX Contest (CW)", hint: "RST + CQ Zone" },
        { id: "cq_ww_ssb", name: "CQ WW DX Contest (SSB)", hint: "RS + CQ Zone" }
      ]
    };

    // --- 2. FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDx9_a-T5-lD2N1BPsSl1LIH3z0m5aJ1K8",
      authDomain: "weblog-17669.firebaseapp.com",
      projectId: "weblog-17669",
      storageBucket: "weblog-17669.firebasestorage.app",
      messagingSenderId: "574825323120",
      appId: "1:574825323120:web:bd3654de564736e1e1f2b5"
    };

    // Initialize Firebase
    let db = null;
    let auth = null;
    let currentUser = null;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase Init Error:", e);
    }

    // Local State
    const LOCAL_STORAGE_KEY = "weblog_qso_records_v2";
    let qsoLogs = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || "[]");
    let currentArea = "national";

    // --- 3. INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      selectArea('national');
      renderTable();
      initAuth();
    });

    // Area Selection
    function selectArea(areaKey) {
      currentArea = areaKey;
      
      // Update Tab UI
      document.querySelectorAll('.area-tab').forEach(btn => btn.classList.remove('active-tab'));
      const activeBtn = document.getElementById(`tab-${areaKey}`);
      if (activeBtn) activeBtn.classList.add('active-tab');

      // Update Contest Dropdown
      const contestSelect = document.getElementById('contestSelect');
      contestSelect.innerHTML = "";

      const list = CONTEST_DATABASE[areaKey] || [];
      list.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        opt.dataset.hint = c.hint;
        contestSelect.appendChild(opt);
      });

      onContestChange();
    }

    function onContestChange() {
      const contestSelect = document.getElementById('contestSelect');
      const selectedOption = contestSelect.options[contestSelect.selectedIndex];
      const hintText = document.getElementById('exchangeHintText');
      if (selectedOption && selectedOption.dataset.hint) {
        hintText.textContent = selectedOption.dataset.hint;
      } else {
        hintText.textContent = "RS(T) + コンテスト規定コード";
      }
      checkDupe();
    }

    // Dupe Check
    function checkDupe() {
      const callsign = document.getElementById('callsign').value.trim().toUpperCase();
      const band = document.getElementById('band').value;
      const contestId = document.getElementById('contestSelect').value;
      const warning = document.getElementById('dupeWarning');

      if (!callsign) {
        warning.classList.add('hidden');
        return;
      }

      const isDupe = qsoLogs.some(log => 
        log.callsign.toUpperCase() === callsign &&
        log.band === band &&
        log.contestId === contestId
      );

      if (isDupe) {
        warning.classList.remove('hidden');
      } else {
        warning.classList.add('hidden');
      }
    }

    // --- 4. LOG OPERATIONS ---
    function handleSaveQso(e) {
      e.preventDefault();

      const callsign = document.getElementById('callsign').value.trim().toUpperCase();
      if (!callsign) return;

      const contestSelect = document.getElementById('contestSelect');

      const qsoData = {
        id: String(Date.now()),
        timestamp: new Date().toISOString(),
        callsign: callsign,
        band: document.getElementById('band').value,
        mode: document.getElementById('mode').value,
        rstSent: document.getElementById('rstSent').value.trim() || "59",
        rstRcvd: document.getElementById('rstRcvd').value.trim() || "59",
        contestId: contestSelect.value,
        contestName: contestSelect.options[contestSelect.selectedIndex]?.text || "",
        area: currentArea
      };

      // 1. Local Immediate Save (Instant UI Update)
      qsoLogs.unshift(qsoData);
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(qsoLogs));
      renderTable();
      resetForm();
      showAlert("QSOを登録しました (ローカル保存完了)", "success");

      // 2. Cloud Async Save (Background)
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).collection("qsoLogs").doc(qsoData.id)
          .set(qsoData)
          .catch(err => console.error("Cloud Save Error:", err));
      }
    }

    function deleteLog(id) {
      const targetIdStr = String(id);
      
      // 1. Local Immediate Delete
      qsoLogs = qsoLogs.filter(log => String(log.id) !== targetIdStr);
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(qsoLogs));
      renderTable();
      showAlert("ログを削除しました", "info");

      // 2. Cloud Async Delete
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).collection("qsoLogs").doc(targetIdStr)
          .delete()
          .catch(err => console.error("Cloud Delete Error:", err));
      }
    }

    function clearAllLogs() {
      if (!confirm("本当に全ての交信ログを消去しますか？")) return;

      qsoLogs = [];
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(qsoLogs));
      renderTable();
      showAlert("全ログを消去しました", "info");
    }

    function resetForm() {
      document.getElementById('callsign').value = "";
      document.getElementById('rstSent').value = "";
      document.getElementById('rstRcvd').value = "";
      document.getElementById('dupeWarning').classList.add('hidden');
    }

    function renderTable() {
      const tbody = document.getElementById('logTableBody');
      document.getElementById('qsoCount').textContent = qsoLogs.length;

      if (qsoLogs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400 font-sans">ログデータがありません</td></tr>`;
        return;
      }

      tbody.innerHTML = qsoLogs.map(log => {
        const dt = new Date(log.timestamp);
        const timeStr = `${dt.getUTCMonth()+1}/${dt.getUTCDate()} ${String(dt.getUTCHours()).padStart(2,'0')}:${String(dt.getUTCMinutes()).padStart(2,'0')}`;
        
        return `
          <tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="p-2.5 text-slate-500">${timeStr}</td>
            <td class="p-2.5 font-bold text-blue-900">${log.callsign}</td>
            <td class="p-2.5">${log.band}</td>
            <td class="p-2.5"><span class="bg-slate-200 px-1.5 py-0.5 rounded text-[11px] font-semibold">${log.mode}</span></td>
            <td class="p-2.5 text-slate-600">${log.rstSent}</td>
            <td class="p-2.5 text-slate-600">${log.rstRcvd}</td>
            <td class="p-2.5 text-slate-500 truncate max-w-[140px]">${log.contestName}</td>
            <td class="p-2.5 text-right font-sans">
              <button onclick="deleteLog('${log.id}')" class="text-red-500 hover:text-red-700 font-medium text-xs">削除</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // --- 5. EXPORT FUNCTIONS ---
    function exportCSV() {
      if (qsoLogs.length === 0) return alert("出力するデータがありません");
      
      let csv = "ID,Timestamp_UTC,Callsign,Band,Mode,Sent,Rcvd,Contest\n";
      qsoLogs.forEach(l => {
        csv += `"${l.id}","${l.timestamp}","${l.callsign}","${l.band}","${l.mode}","${l.rstSent}","${l.rstRcvd}","${l.contestName}"\n`;
      });

      downloadFile(csv, `qso_log_${Date.now()}.csv`, "text/csv");
    }

    function exportCabrillo() {
      if (qsoLogs.length === 0) return alert("出力するデータがありません");

      let cab = "START-OF-LOG: 3.0\nCONTEST: JARL-CONTEST\nCALLSIGN: YOUR-CALLSIGN\n";
      qsoLogs.forEach(l => {
        const dt = new Date(l.timestamp);
        const dateStr = dt.toISOString().slice(0,10).replace(/-/g, '');
        const timeStr = String(dt.getUTCHours()).padStart(2,'0') + String(dt.getUTCMinutes()).padStart(2,'0');
        const freq = l.band.replace('MHz', '000').replace('.', '');
        
        cab += `QSO: ${freq.padStart(5)} ${l.mode.padEnd(2)} ${dateStr} ${timeStr} YOUR-CALL ${l.rstSent.padEnd(6)} ${l.callsign.padEnd(10)} ${l.rstRcvd}\n`;
      });
      cab += "END-OF-LOG:\n";

      downloadFile(cab, `cabrillo_log_${Date.now()}.txt`, "text/plain");
    }

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
    }

    // --- 6. AUTHENTICATION & UTILS ---
    function initAuth() {
      if (!auth) return;

      auth.onAuthStateChanged(user => {
        currentUser = user;
        const userInfo = document.getElementById('userInfo');
        const userName = document.getElementById('userName');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        if (user) {
          userName.textContent = user.displayName || user.email;
          userInfo.classList.remove('hidden');
          loginBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
        } else {
          userInfo.classList.add('hidden');
          loginBtn.classList.remove('hidden');
          logoutBtn.classList.add('hidden');
        }
      });

      document.getElementById('loginBtn').addEventListener('click', () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => {
          showAlert(`ログイン失敗: ${err.message}`, "danger");
        });
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        auth.signOut();
      });
    }

    function showAlert(msg, type = "info") {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = "p-4 rounded-lg text-sm font-medium transition-all shadow border ";
      
      if (type === "success") box.className += "bg-emerald-50 text-emerald-800 border-emerald-200";
      else if (type === "danger") box.className += "bg-red-50 text-red-800 border-red-200";
      else box.className += "bg-blue-50 text-blue-800 border-blue-200";

      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 3500);
    }
  </script>
</body>
</html>
