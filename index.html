<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アマチュア無線コンテストログ (WebLog Contest Console)</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
.active-tab {
  background-color: #2563eb !important;
  color: #ffffff !important;
  font-weight: bold;
}
</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-cyan-500 selection:text-white">

<!-- Header -->
<header class="bg-slate-900 border-b border-slate-800 text-white shadow-lg sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center gap-3">
      <span class="text-2xl">📻</span>
      <div>
        <h1 class="text-lg font-bold tracking-wide">WebLog Contest Console</h1>
        <div class="flex items-center gap-2 text-xs">
          <span id="syncStatus" class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-medium">☁️ 未ログイン (ローカル保存)</span>
        </div>
      </div>
    </div>
    <div id="authStatus" class="flex items-center gap-3 text-sm">
      <span id="userInfo" class="hidden text-slate-300">ユーザー: <strong id="userName" class="text-white"></strong></span>
      <button id="loginBtn" onclick="window.loginGoogle()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition">Googleログイン</button>
      <button id="logoutBtn" onclick="window.logoutGoogle()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-1.5 rounded-lg text-xs font-medium transition">ログアウト</button>
    </div>
  </div>
</header>

<!-- Main Container -->
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <!-- Alert Box -->
  <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium transition-all shadow-md"></div>

  <!-- Area & Contest Selector Panel -->
  <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800">
    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">1. エリア・コンテストの選択</h2>
    <div class="flex flex-wrap gap-1.5 mb-4" id="areaTabs">
      <button onclick="window.selectArea('national')" id="tab-national" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">全国</button>
      <button onclick="window.selectArea('1')" id="tab-1" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">1エリア(関東)</button>
      <button onclick="window.selectArea('2')" id="tab-2" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">2エリア(東海)</button>
      <button onclick="window.selectArea('3')" id="tab-3" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">3エリア(関西)</button>
      <button onclick="window.selectArea('4')" id="tab-4" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">4エリア(中国)</button>
      <button onclick="window.selectArea('5')" id="tab-5" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">5エリア(四国)</button>
      <button onclick="window.selectArea('6')" id="tab-6" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">6エリア(九州)</button>
      <button onclick="window.selectArea('7')" id="tab-7" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">7エリア(東北)</button>
      <button onclick="window.selectArea('8')" id="tab-8" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">8エリア(北海道)</button>
      <button onclick="window.selectArea('9')" id="tab-9" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">9エリア(北陸)</button>
      <button onclick="window.selectArea('0')" id="tab-0" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 transition">0エリア(信越)</button>
    </div>
    <div>
      <label for="contestSelect" class="block text-xs font-semibold text-slate-400 mb-1">対象コンテスト</label>
      <select id="contestSelect" onchange="window.onContestChange()" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </select>
    </div>
  </section>

  <!-- Logging Form -->
  <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800">
    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">2. QSOデータ入力</h2>
    <form id="qsoForm" onsubmit="window.handleSaveQso(event)" class="space-y-4">
      <input type="hidden" id="editIndex" value="-1">
      
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-7 gap-3">
        <!-- QSO Time (紙ログ対応) -->
        <div class="col-span-2 sm:col-span-2 md:col-span-2">
          <label class="block text-xs font-semibold text-cyan-400 mb-1">交信日時 (紙ログ後打対応)</label>
          <input type="datetime-local" id="qsoTime" required class="w-full border border-slate-700 bg-slate-800 text-slate-100 font-mono text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Callsign -->
        <div class="col-span-2 sm:col-span-1 md:col-span-2">
          <label class="block text-xs font-semibold text-slate-400 mb-1">相手コールサイン *</label>
          <input type="text" id="callsign" required placeholder="例: JA2YAA" oninput="this.value = this.value.toUpperCase(); window.checkDupe();" class="w-full border border-slate-700 bg-slate-800 text-slate-100 font-mono text-base font-bold rounded-lg p-2 focus:ring-2 focus:ring-blue-500 uppercase tracking-wider outline-none">
          <span id="dupeWarning" class="text-xs text-red-400 font-bold hidden block mt-0.5">⚠️ DUPE（交信済み）</span>
        </div>

        <!-- Band -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">周波数 (Band)</label>
          <select id="band" onchange="window.checkDupe()" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="1.9MHz">1.9 MHz</option>
            <option value="3.5MHz">3.5 MHz</option>
            <option value="7MHz" selected>7 MHz</option>
            <option value="14MHz">14 MHz</option>
            <option value="21MHz">21 MHz</option>
            <option value="28MHz">28 MHz</option>
            <option value="50MHz">50 MHz</option>
            <option value="144MHz">144 MHz</option>
            <option value="430MHz">430 MHz</option>
            <option value="1200MHz">1200 MHz</option>
            <option value="2400MHz">2400 MHz</option>
            <option value="5600MHz">5600 MHz</option>
            <option value="10.1GHz">10.1 GHz</option>
          </select>
        </div>

        <!-- Mode -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">モード (Mode)</label>
          <select id="mode" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="CW">CW</option>
            <option value="SSB" selected>SSB</option>
            <option value="FM">FM</option>
            <option value="AM">AM</option>
            <option value="RTTY">RTTY</option>
            <option value="FT8">FT8</option>
            <option value="FT4">FT4</option>
            <option value="D-STAR">D-STAR (DV)</option>
            <option value="C4FM">C4FM</option>
            <option value="DMR">DMR</option>
            <option value="PSK31">PSK31</option>
            <option value="SSTV">SSTV</option>
          </select>
        </div>

        <!-- Sent Exchange Control & Input -->
        <div class="col-span-2 sm:col-span-3 md:col-span-1">
          <label class="block text-xs font-semibold text-slate-400 mb-1">送信ナンバー</label>
          <input type="text" id="rstSent" placeholder="59001" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-4 md:grid-cols-6 gap-3 items-center">
        <!-- Rcvd Exchange -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">受信ナンバー</label>
          <input type="text" id="rstRcvd" placeholder="5910" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Sent Mode Selection -->
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-400 mb-1">送信ナンバー動作</label>
          <div class="flex items-center gap-3 pt-1 text-xs">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="exchangeMode" value="fixed" class="text-cyan-500 focus:ring-0"> 固定
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="exchangeMode" value="increment" checked class="text-cyan-500 focus:ring-0"> 連番 (+1自動加算)
            </label>
            <button type="button" onclick="window.resetSerial()" class="text-[10px] bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-2 py-0.5 rounded transition">↺ リセット</button>
          </div>
        </div>

        <!-- Remarks -->
        <div class="sm:col-span-3 md:col-span-2">
          <label class="block text-xs font-semibold text-slate-400 mb-1">備考 / メモ</label>
          <input type="text" id="remarks" placeholder="OP名、QTHなど" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Action Buttons -->
        <div class="sm:col-span-4 md:col-span-1 flex gap-2 pt-4 sm:pt-0">
          <button type="submit" id="saveBtn" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-3 rounded-lg text-xs transition shadow-md whitespace-nowrap">交信保存</button>
          <button type="button" id="cancelEditBtn" onclick="window.resetForm()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2 px-2 rounded-lg text-xs transition">取消</button>
        </div>
      </div>
    </form>
  </section>

  <!-- Log List Section -->
  <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800 space-y-4">
    <div class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-800 pb-3">
      <div class="flex items-center gap-3">
        <h2 class="text-base font-bold text-white">交信ログ一覧</h2>
        <span id="logCountBadge" class="bg-cyan-950 text-cyan-400 border border-cyan-800 text-xs font-mono font-bold px-2.5 py-0.5 rounded-full">0件</span>
      </div>
      
      <div class="flex flex-wrap items-center gap-2">
        <select id="tableFilter" onchange="window.renderTable()" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg p-1.5 focus:ring-2 focus:ring-cyan-500 outline-none">
          <option value="selected">現在のコンテストのみ表示</option>
          <option value="all">すべてのログを表示</option>
        </select>
        <input type="text" id="searchInput" oninput="window.renderTable()" placeholder="コールサイン検索..." class="bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-cyan-500 outline-none w-36">
        <button onclick="window.openImportModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">📥 インポート</button>
        <button onclick="window.openExportModal()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg transition">📤 エクスポート</button>
      </div>
    </div>

    <!-- Log Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs text-slate-300">
        <thead class="bg-slate-800/80 text-slate-400 font-semibold uppercase tracking-wider border-b border-slate-700">
          <tr>
            <th class="p-2.5">日時 (UTC)</th>
            <th class="p-2.5">Callsign</th>
            <th class="p-2.5">Band</th>
            <th class="p-2.5">Mode</th>
            <th class="p-2.5">Sent</th>
            <th class="p-2.5">Rcvd</th>
            <th class="p-2.5">コンテスト名</th>
            <th class="p-2.5">備考</th>
            <th class="p-2.5 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="logTableBody" class="divide-y divide-slate-800 font-mono">
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- Modal: Export -->
<div id="exportModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center">
      <h3 class="text-base font-bold text-white">ログ出力・サマリーシート作成</h3>
      <button onclick="window.closeExportModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
    </div>
    
    <div class="p-4 overflow-y-auto space-y-4 text-xs">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-800/50 p-3 rounded-lg border border-slate-800">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">出力対象</label>
          <select id="exportScope" onchange="window.updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200">
            <option value="selected">現在選択中のコンテストのみ</option>
            <option value="all">全コンテストログ</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">出力形式</label>
          <select id="exportFormat" onchange="window.updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200">
            <option value="jarl">JARL推奨テキスト形式 (.log)</option>
            <option value="adif">ADIF形式 (.adi)</option>
            <option value="csv">CSV形式 (.csv)</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">ソート順</label>
          <select id="exportSort" onchange="window.updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200">
            <option value="time">日時順 (UTC)</option>
            <option value="band">周波数順 (Band)</option>
          </select>
        </div>
      </div>

      <div id="jarlFields" class="bg-slate-800/30 p-3 rounded-lg border border-slate-800/80 space-y-2">
        <span class="font-bold text-cyan-400 block mb-1">JARLサマリーシート入力項目</span>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          <div>
            <label class="block text-slate-400 text-[10px]">自局コールサイン</label>
            <input type="text" id="summaryMyCall" placeholder="JA1ZLO" oninput="window.updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1 text-slate-100 uppercase">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px]">参加種目コード</label>
            <input type="text" id="summaryCategory" placeholder="C7" oninput="window.updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1 text-slate-100">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px]">氏名 / Name</label>
            <input type="text" id="summaryName" placeholder="電波 太郎" oninput="window.updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1 text-slate-100">
          </div>
          <div class="col-span-2">
            <label class="block text-slate-400 text-[10px]">住所 / Address</label>
            <input type="text" id="summaryAddress" placeholder="東京都千代田区..." oninput="window.updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1 text-slate-100">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px]">連絡先 Email</label>
            <input type="email" id="summaryEmail"
