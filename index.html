<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アマチュア無線コンテストログ (WebLog Contest Console)</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase Compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  .active-tab {
    background-color: #0284c7 !important; /* sky-600 */
    color: #ffffff !important;
    font-weight: 700;
    border-color: #38bdf8 !important;
  }
</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-cyan-500 selection:text-white pb-12">

<!-- Header -->
<header class="bg-slate-900 border-b border-slate-800 text-white shadow-lg sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center gap-3">
      <span class="text-2xl">📻</span>
      <div>
        <h1 class="text-lg font-bold tracking-wide">WebLog Contest Console</h1>
        <div class="flex items-center gap-2 text-xs mt-0.5">
          <span id="syncStatus" class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-medium border border-slate-700">☁️ ローカル保存中</span>
        </div>
      </div>
    </div>
    <div id="authStatus" class="flex items-center gap-3 text-sm">
      <span id="userInfo" class="hidden text-slate-300 text-xs">ユーザー: <strong id="userName" class="text-cyan-400"></strong></span>
      <button id="loginBtn" onclick="loginGoogle()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition shadow">Googleログイン</button>
      <button id="logoutBtn" onclick="logoutGoogle()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3.5 py-1.5 rounded-lg text-xs font-medium transition">ログアウト</button>
    </div>
  </div>
</header>

<!-- Main Container -->
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <!-- Toast Notification Box -->
  <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium transition-all shadow-lg border"></div>

  <!-- Area & Contest Selector Panel -->
  <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800">
    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
      <span>1. エリア・コンテストの選択</span>
    </h2>
    <!-- Area Tabs -->
    <div class="flex flex-wrap gap-1.5 mb-4" id="areaTabs">
      <button type="button" onclick="selectArea('national')" id="tab-national" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">全国</button>
      <button type="button" onclick="selectArea('1')" id="tab-1" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">1エリア(関東)</button>
      <button type="button" onclick="selectArea('2')" id="tab-2" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">2エリア(東海)</button>
      <button type="button" onclick="selectArea('3')" id="tab-3" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">3エリア(関西)</button>
      <button type="button" onclick="selectArea('4')" id="tab-4" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">4エリア(中国)</button>
      <button type="button" onclick="selectArea('5')" id="tab-5" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">5エリア(四国)</button>
      <button type="button" onclick="selectArea('6')" id="tab-6" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">6エリア(九州)</button>
      <button type="button" onclick="selectArea('7')" id="tab-7" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">7エリア(東北)</button>
      <button type="button" onclick="selectArea('8')" id="tab-8" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">8エリア(北海道)</button>
      <button type="button" onclick="selectArea('9')" id="tab-9" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">9エリア(北陸)</button>
      <button type="button" onclick="selectArea('0')" id="tab-0" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition">0エリア(信越)</button>
    </div>
    <!-- Contest Dropdown -->
    <div>
      <label for="contestSelect" class="block text-xs font-semibold text-slate-400 mb-1">対象コンテスト</label>
      <select id="contestSelect" onchange="onContestChange()" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none cursor-pointer">
      </select>
    </div>
  </section>

  <!-- Logging Form Section -->
  <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800">
    <div class="flex flex-wrap justify-between items-center gap-2 mb-3 border-b border-slate-800 pb-2">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">2. QSOデータ入力</h2>
      
      <!-- Sent Exchange Mode Switcher (固定 vs 連番+1) -->
      <div class="flex items-center gap-2 bg-slate-950 p-1.5 rounded-lg border border-slate-800 text-xs">
        <span class="text-slate-400 font-semibold px-1">送信ナンバー方式:</span>
        <label class="flex items-center gap-1 cursor-pointer text-slate-200">
          <input type="radio" name="sentNumMode" value="fixed" onchange="onSentNumModeChange()" class="text-cyan-500 focus:ring-0">
          <span>固定 (例: 5910)</span>
        </label>
        <label class="flex items-center gap-1 cursor-pointer text-slate-200 ml-2">
          <input type="radio" name="sentNumMode" value="auto_increment" checked onchange="onSentNumModeChange()" class="text-cyan-500 focus:ring-0">
          <span class="text-cyan-300 font-bold">連番 (+1自動加算)</span>
        </label>
        <button type="button" onclick="resetSerialNum()" title="連番を初期値(例: 59001)にリセット" class="ml-2 px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded text-[11px] transition">
          ↺ 連番リセット
        </button>
      </div>
    </div>

    <form id="qsoForm" onsubmit="handleSaveQso(event)" class="space-y-4">
      <input type="hidden" id="editIndex" value="-1">
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
        <!-- Callsign -->
        <div class="col-span-2 sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-400 mb-1">相手コールサイン *</label>
          <input type="text" id="callsign" required placeholder="例: JH2YQB" oninput="this.value = this.value.toUpperCase(); checkDupe();" class="w-full border border-slate-700 bg-slate-800 text-slate-100 font-mono text-lg font-bold rounded-lg p-2 focus:ring-2 focus:ring-cyan-500 uppercase tracking-wider outline-none">
          <span id="dupeWarning" class="text-xs text-red-400 font-bold hidden">⚠️ DUPE（同一Band・コンテストで交信済み）</span>
        </div>
        <!-- Band -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">周波数 (Band)</label>
          <select id="band" onchange="checkDupe()" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
            <option value="1.9MHz">1.9 MHz</option>
            <option value="3.5MHz">3.5 MHz</option>
            <option value="7MHz" selected>7 MHz</option>
            <option value="14MHz">14 MHz</option>
            <option value="21MHz">21 MHz</option>
            <option value="28MHz">28 MHz</option>
            <option value="50MHz">50 MHz</option>
            <option value="144MHz">144 MHz</option>
            <option value="430MHz">430 MHz</option>
            <option value="1200MHz">1200 MHz</option>
            <option value="2400MHz">2400 MHz</option>
          </select>
        </div>
        <!-- Mode -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">モード (Mode)</label>
          <select id="mode" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
            <option value="CW">CW</option>
            <option value="SSB" selected>SSB</option>
            <option value="FM">FM</option>
            <option value="AM">AM</option>
            <option value="RTTY">RTTY</option>
            <option value="FT8">FT8</option>
            <option value="FT4">FT4</option>
            <option value="D-STAR">D-STAR (DV)</option>
            <option value="C4FM">C4FM</option>
            <option value="DMR">DMR</option>
            <option value="PSK31">PSK31</option>
            <option value="SSTV">SSTV</option>
          </select>
        </div>
        <!-- Sent Exchange -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1 flex justify-between">
            <span>送信ナンバー</span>
            <span id="sentModeLabel" class="text-[10px] text-cyan-400 font-mono">連番+1</span>
          </label>
          <input type="text" id="rstSent" value="59001" placeholder="59001" class="w-full border border-slate-700 bg-slate-800 text-slate-100 font-mono text-base font-bold rounded-lg p-2 focus:ring-2 focus:ring-cyan-500 outline-none">
        </div>
        <!-- Rcvd Exchange -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">受信ナンバー</label>
          <input type="text" id="rstRcvd" placeholder="5910" class="w-full border border-slate-700 bg-slate-800 text-slate-100 font-mono text-base font-bold rounded-lg p-2 focus:ring-2 focus:ring-cyan-500 outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-center">
        <div class="sm:col-span-3">
          <label class="block text-xs font-semibold text-slate-400 mb-1">備考 / メモ (OP名・QTHなど)</label>
          <input type="text" id="remarks" placeholder="例: 1kW, JCC#1001" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
        </div>
        <div class="flex gap-2 mt-4 sm:mt-0">
          <button type="submit" id="saveBtn" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 px-4 rounded-lg text-sm transition shadow-md active:scale-95">
            交信保存 (Enter)
          </button>
          <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 px-3 rounded-lg text-sm transition">
            キャンセル
          </button>
        </div>
      </div>
    </form>
  </section>

  <!-- Log List Section -->
  <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800 space-y-4">
    <div class="flex flex-wrap justify-between items-center gap-3 border-b border-slate-800 pb-3">
      <div class="flex items-center gap-3">
        <h2 class="text-base font-bold text-white">交信ログ一覧</h2>
        <span id="logCountBadge" class="bg-cyan-950 text-cyan-400 border border-cyan-800 text-xs font-mono font-bold px-2.5 py-0.5 rounded-full">0件</span>
      </div>
      
      <!-- Table Filters & Actions -->
      <div class="flex flex-wrap items-center gap-2">
        <select id="tableFilter" onchange="renderTable()" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg p-2 focus:ring-2 focus:ring-cyan-500 outline-none">
          <option value="selected">現在のコンテストのみ表示</option>
          <option value="all">すべてのログを表示</option>
        </select>
        <input type="text" id="searchInput" oninput="renderTable()" placeholder="コールサイン検索..." class="bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-lg px-2.5 py-2 focus:ring-2 focus:ring-cyan-500 outline-none w-36">
        <button type="button" onclick="openImportModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold px-3 py-2 rounded-lg transition">📥 インポート</button>
        <button type="button" onclick="openExportModal()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 text-xs font-bold px-3 py-2 rounded-lg transition">📤 エクスポート</button>
      </div>
    </div>

    <!-- Log Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs text-slate-300">
        <thead class="bg-slate-800/80 text-slate-400 font-semibold uppercase tracking-wider border-b border-slate-700">
          <tr>
            <th class="p-2.5">日時 (UTC)</th>
            <th class="p-2.5">Callsign</th>
            <th class="p-2.5">Band</th>
            <th class="p-2.5">Mode</th>
            <th class="p-2.5">Sent</th>
            <th class="p-2.5">Rcvd</th>
            <th class="p-2.5">コンテスト名</th>
            <th class="p-2.5">備考</th>
            <th class="p-2.5 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="logTableBody" class="divide-y divide-slate-800 font-mono">
          <!-- JSで動的生成 -->
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- Delete Confirmation Modal (Native confirm() replacement) -->
<div id="deleteConfirmModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
    <h3 class="text-base font-bold text-white flex items-center gap-2">⚠️ QSOログの削除</h3>
    <p class="text-xs text-slate-300">選択した交信データを削除します。よろしいですか？</p>
    <input type="hidden" id="deleteTargetIndex" value="-1">
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" onclick="closeDeleteModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-xs font-medium">キャンセル</button>
      <button type="button" onclick="confirmDeleteQso()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition">削除する</button>
    </div>
  </div>
</div>

<!-- Modal: Export -->
<div id="exportModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center">
      <h3 class="text-base font-bold text-white">ログ出力・サマリーシート作成</h3>
      <button type="button" onclick="closeExportModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
    </div>
    
    <div class="p-4 overflow-y-auto space-y-4 text-xs">
      <!-- Options -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-800/50 p-3 rounded-lg border border-slate-800">
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">出力対象</label>
          <select id="exportScope" onchange="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-slate-200">
            <option value="selected">現在選択中のコンテストのみ</option>
            <option value="all">全コンテストログ</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">出力形式</label>
          <select id="exportFormat" onchange="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-slate-200">
            <option value="jarl">JARL推奨テキスト形式 (.log)</option>
            <option value="adif">ADIF形式 (.adi)</option>
            <option value="csv">CSV形式 (.csv)</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">ソート順</label>
          <select id="exportSort" onchange="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-slate-200">
            <option value="time">日時順 (UTC)</option>
            <option value="band">周波数順 (Band)</option>
          </select>
        </div>
      </div>

      <!-- JARL Header Fields -->
      <div id="jarlFields" class="bg-slate-800/30 p-3 rounded-lg border border-slate-800/80 space-y-2">
        <span class="font-bold text-cyan-400 block mb-1">JARLサマリーシート入力項目</span>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          <div>
            <label class="block text-slate-400 text-[10px]">自局コールサイン</label>
            <input type="text" id="summaryMyCall" placeholder="JA1ZLO" oninput="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-100 uppercase">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px]">参加種目コード</label>
            <input type="text" id="summaryCategory" placeholder="C7" oninput="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-100">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px]">氏名 / Name</label>
            <input type="text" id="summaryName" placeholder="電波 太郎" oninput="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-100">
          </div>
          <div class="col-span-2">
            <label class="block text-slate-400 text-[10px]">住所 / Address</label>
            <input type="text" id="summaryAddress" placeholder="東京都千代田区..." oninput="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-100">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px]">連絡先 Email</label>
            <input type="email" id="summaryEmail" placeholder="cq@example.com" oninput="updateExportPreview()" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-100">
          </div>
        </div>
      </div>

      <!-- Preview Box -->
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">出力プレビュー (出力ファイルと100%同一内容)</label>
        <textarea id="exportPreview" readonly class="w-full h-52 bg-black text-green-400 font-mono text-xs p-3 rounded-lg border border-slate-800 outline-none leading-relaxed"></textarea>
      </div>
    </div>

    <div class="p-4 border-t border-slate-800 flex justify-end gap-2">
      <button type="button" onclick="copyExportText()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-4 py-2 rounded-lg text-xs transition">📋 クリップボードにコピー</button>
      <button type="button" onclick="downloadExportFile()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition shadow-md">💾 ファイル保存</button>
    </div>
  </div>
</div>

<!-- Modal: Import -->
<div id="importModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-2xl flex flex-col shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center">
      <h3 class="text-base font-bold text-white">交信ログ インポート</h3>
      <button type="button" onclick="closeImportModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
    </div>
    
    <div class="p-4 space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">ファイルから読み込み (.csv, .log, .txt, .adi)</label>
        <input type="file" id="importFile" accept=".csv,.log,.txt,.adi" onchange="handleFileSelect(event)" class="w-full bg-slate-800 text-slate-200 border border-slate-700 rounded p-2 text-xs">
      </div>
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">またはテキスト直接貼り付け</label>
        <textarea id="importText" placeholder="CSVまたはJARL/ADIFフォーマットのテキストを貼り付けてください" class="w-full h-36 bg-slate-950 border border-slate-800 rounded p-2.5 font-mono text-slate-200 text-xs focus:ring-2 focus:ring-cyan-500 outline-none"></textarea>
      </div>
      <div>
        <label class="block text-slate-400 mb-1 font-semibold">インポートモード</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-1.5 text-slate-300 cursor-pointer">
            <input type="radio" name="importMode" value="append" checked class="text-cyan-500"> 既存ログに追加
          </label>
          <label class="flex items-center gap-1.5 text-slate-300 cursor-pointer">
            <input type="radio" name="importMode" value="overwrite" class="text-cyan-500"> 全データを置き換え
          </label>
        </div>
      </div>
    </div>

    <div class="p-4 border-t border-slate-800 flex justify-end gap-2">
      <button type="button" onclick="closeImportModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-xs font-medium">キャンセル</button>
      <button type="button" onclick="executeImport()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition">インポート実行</button>
    </div>
  </div>
</div>

<script>
// --- CONTEST LIST DATA ---
const CONTEST_DATA = {
  national: [
    "ALL JAコンテスト",
    "6m and downコンテスト",
    "フィールドデーコンテスト",

      break;

  }
}

function incrementSerialNumber(exchangeStr) {
  if (!exchangeStr) return "59001";
  // Match trailing digits e.g. "59001" -> "59", "001"
  const match = exchangeStr.match(/^(.*?)(\d+)$/);
  if (match) {
    const prefix = match[1];
    const numStr = match[2];
    const nextVal = parseInt(numStr, 10) + 1;
    const padded = String(nextVal).padStart(numStr.length, "0");
    return prefix + padded;
  }
  return exchangeStr + "1";
}

  rstSentInput.value = "59001";

}

// --- QSO INPUT & DUPE CHECK ---
function checkDupe() {
  const call = document.getElementById("callsign").value.trim().toUpperCase();
  const band = document.getElementById("band").value;
  const warning = document.getElementById("dupeWarning");
  const editIdx = parseInt(document.getElementById("editIndex").value);

  if (!call) {
    warning.classList.add("hidden");
    return;
  }

  const isDupe = qsos.some((q, idx) => idx !== editIdx && q.contest === selectedContest && q.callsign === call && q.band === band);
  if (isDupe) {
    warning.classList.remove("hidden");
  } else {
    warning.classList.add("hidden");
  }
}

function handleSaveQso(e) {
  e.preventDefault();
  const callsign = document.getElementById("callsign").value.trim().toUpperCase();
  const band = document.getElementById("band").value;
  const mode = document.getElementById("mode").value;
  const rstSentInput = document.getElementById("rstSent");
  const rstSent = rstSentInput.value.trim() || "59001";
  const rstRcvd = document.getElementById("rstRcvd").value.trim() || "59";
  const remarks = document.getElementById("remarks").value.trim();
  const editIdx = parseInt(document.getElementById("editIndex").value);

  if (!callsign) {
    showAlert("相手コールサインを入力してください。", "error");
    return;
  }

  const now = new Date();
  const timeIso = now.toISOString();

  const qsoData = {
    time: editIdx >= 0 ? qsos[editIdx].time : timeIso,
    callsign,
    band,
    mode,
    rstSent,
    rstRcvd,
    contest: selectedContest || "一般交信",
    remarks
  };

  if (editIdx >= 0) {
    qsos[editIdx] = qsoData;
    showAlert("交信ログを更新しました。", "success");
  } else {
    qsos.unshift(qsoData);
    showAlert(`QSO保存完了: ${callsign} (${band}/${mode})`, "success");

    // Auto-increment serial number if enabled
    if (sentNumberMode === "auto_increment") {
      rstSentInput.value = incrementSerialNumber(rstSent);
    }
  }

  resetForm(false); // keep sent exchange intact or incremented
  saveToStorage();
}

function editQso(index) {
  const q = qsos[index];
  if (!q) return;
  document.getElementById("editIndex").value = index;
  document.getElementById("callsign").value = q.callsign;
  document.getElementById("band").value = q.band;
  document.getElementById("mode").value = q.mode;
  document.getElementById("rstSent").value = q.rstSent;
  document.getElementById("rstRcvd").value = q.rstRcvd;

  document.getElementById("saveBtn").textContent = "変更を保存";
  document.getElementById("cancelEditBtn").classList.remove("hidden");
  window.scrollTo({ top: 120, behavior: "smooth" });
}

// --- TABLE RENDER ---
function renderTable() {
  const tbody = document.getElementById("logTableBody");
  const filterType = document.getElementById("tableFilter").value;
  const searchKeyword = document.getElementById("searchInput").value.trim().toUpperCase();

  tbody.innerHTML = "";

  let filtered = qsos.filter(q => {
    if (filterType === "selected" && q.contest !== selectedContest) return false;
    if (searchKeyword && !q.callsign.includes(searchKeyword)) return false;
    return true;
  });

  document.getElementById("logCountBadge").textContent = `${filtered.length}件`;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-slate-500 font-sans">交信データがありません</td></tr>`;
    return;
  }

  filtered.forEach((q) => {
    const originalIndex = qsos.indexOf(q);
    const tr = document.createElement("tr");
    tr.className = "hover:bg-slate-800/50 transition border-b border-slate-800/60";
    
    const d = new Date(q.time);
    const dateStr = d.getUTCFullYear() + "-" +
      String(d.getUTCMonth() + 1).padStart(2, '0') + "-" +
      String(d.getUTCDate()).padStart(2, '0') + " " +
      String(d.getUTCHours()).padStart(2, '0') + ":" +
      String(d.getUTCMinutes()).padStart(2, '0');

    tr.innerHTML = `
      <td class="p-2.5 text-slate-400 whitespace-nowrap">${dateStr}</td>
      <td class="p-2.5 font-bold text-cyan-300">${q.callsign}</td>
      <td class="p-2.5 text-slate-200">${q.band}</td>
      <td class="p-2.5 text-slate-200">${q.mode}</td>
      <td class="p-2.5 text-slate-300 font-bold">${q.rstSent}</td>
      <td class="p-2.5 text-slate-300 font-bold">${q.rstRcvd}</td>
      <td class="p-2.5 text-slate-400 font-sans text-[11px]">${q.contest || ''}</td>
      <td class="p-2.5 text-slate-400 font-sans text-[11px] max-w-xs truncate">${q.remarks || ''}</td>
      <td class="p-2.5 text-center whitespace-nowrap">
        <button type="button" onclick="editQso(${originalIndex})" class="text-blue-400 hover:text-blue-300 font-sans mr-3.5 transition">編集</button>

function getSortedExportLogs() {
  const scope = document.getElementById("exportScope").value;
  const sortType = document.getElementById("exportSort").value;

  let logs = qsos.filter(q => scope === "all" || q.contest === selectedContest);

  if (sortType === "band") {
    logs.sort((a, b) => {
      let idxA = BAND_ORDER.indexOf(a.band);
      let idxB = BAND_ORDER.indexOf(b.band);
      if (idxA === -1) idxA = 99;
      if (idxB === -1) idxB = 99;
      if (idxA !== idxB) return idxA - idxB;
      return new Date(a.time) - new Date(b.time);
    });
  } else {
    logs.sort((a, b) => new Date(a.time) - new Date(b.time));
  }
  return logs;
}

function updateExportPreview() {
  const format = document.getElementById("exportFormat").value;
  const jarlFields = document.getElementById("jarlFields");
  const preview = document.getElementById("exportPreview");
  const logs = getSortedExportLogs();

  if (format === "jarl") {
    jarlFields.classList.remove("hidden");

    const category = document.getElementById("summaryCategory").value || "CATEGORY";
    const name = document.getElementById("summaryName").value || "NAME";
    const address = document.getElementById("summaryAddress").value || "ADDRESS";
    const email = document.getElementById("summaryEmail").value || "EMAIL";

    let text = `<SUMMARYSHEET VERSION=R2.0>\n`;
    text += `<CONTESTNAME>${selectedContest || 'CONTEST'}</CONTESTNAME>\n`;
    text += `<CALLSIGN>${myCall}</CALLSIGN>\n`;
    text += `<CATEGORY>${category}</CATEGORY>\n`;
    text += `<NAME>${name}</NAME>\n`;
    text += `<ADDRESS>${address}</ADDRESS>\n`;
    text += `<EMAIL>${email}</EMAIL>\n`;
    text += `<LOGSHEET>\n`;
    text += `DATE       TIME  BAND   MODE CALLSIGN      SENT  RCVD\n`;

    logs.forEach(q => {
      const d = new Date(q.time);
      const dateStr = d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, '0') + "-" + String(d.getUTCDate()).padStart(2, '0');
      const timeStr = String(d.getUTCHours()).padStart(2, '0') + ":" + String(d.getUTCMinutes()).padStart(2, '0');
      text += `${dateStr} ${timeStr} ${q.band.padEnd(6)} ${q.mode.padEnd(4)} ${q.callsign.padEnd(13)} ${q.rstSent.padEnd(5)} ${q.rstRcvd}\n`;
    });

    text += `</LOGSHEET>\n</SUMMARYSHEET>`;
    preview.value = text;
  } else if (format === "csv") {
    jarlFields.classList.add("hidden");
    let text = "DATE_UTC,TIME_UTC,CALLSIGN,BAND,MODE,RST_SENT,RST_RCVD,CONTEST,REMARKS\n";
    logs.forEach(q => {
      const d = new Date(q.time);
      const dateStr = d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, '0') + "-" + String(d.getUTCDate()).padStart(2, '0');
      const timeStr = String(d.getUTCHours()).padStart(2, '0') + ":" + String(d.getUTCMinutes()).padStart(2, '0');
      text += `"${dateStr}","${timeStr}","${q.callsign}","${q.band}","${q.mode}","${q.rstSent}","${q.rstRcvd}","${q.contest}","${q.remarks || ''}"\n`;
    });
    preview.value = text;
  } else if (format === "adif") {
    jarlFields.classList.add("hidden");
    let text = "WebLog Contest Console ADIF Export\n<EOH>\n";
    logs.forEach(q => {
      const d = new Date(q.time);
      const yyyymmdd = d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, '0') + String(d.getUTCDate()).padStart(2, '0');
      const hhmm = String(d.getUTCHours()).padStart(2, '0') + String(d.getUTCMinutes()).padStart(2, '0');
      text += `<CALL:${q.callsign.length}>${q.callsign} <QSO_DATE:8>${yyyymmdd} <TIME_ON:4>${hhmm} <BAND:${q.band.length}>${q.band} <MODE:${q.mode.length}>${q.mode} <RST_SENT:${q.rstSent.length}>${q.rstSent} <RST_RCVD:${q.rstRcvd.length}>${q.rstRcvd} <COMMENT:${(q.contest || '').length}>${q.contest || ''} <EOR>\n`;
    });
    preview.value = text;
  }
}

    document.execCommand("copy");
    showAlert("クリップボードにコピーしました！", "success");
  } catch (err) {
    showAlert("コピーに失敗しました", "error");

function downloadExportFile() {
  const format = document.getElementById("exportFormat").value;
  const content = document.getElementById("exportPreview").value;
  let ext = "txt";
  if (format === "jarl") ext = "log";
  if (format === "csv") ext = "csv";
  if (format === "adif") ext = "adi";

  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `contest_log_${new Date().toISOString().slice(0, 10)}.${ext}`;
  a.click();
}

function openImportModal() {
  document.getElementById("importModal").classList.remove("hidden");
}

function closeImportModal() {
  document.getElementById("importModal").classList.add("hidden");
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    document.getElementById("importText").value = evt.target.result;
  };
  reader.readAsText(file);
}

function executeImport() {
  const text = document.getElementById("importText").value.trim();
  const mode = document.querySelector('input[name="importMode"]:checked').value;

  if (!text) {
    showAlert("インポートするテキストが存在しません。", "error");
    return;
  }

  const lines = text.split("\n");
  const importedQsos = [];

  lines.forEach(line => {
    line = line.trim();
    if (!line || line.startsWith("<") || line.startsWith("#")) return;
    
    // Parse CSV line
    const parts = line.split(",").map(p => p.replace(/^"|"$/g, '').trim());
    if (parts.length >= 7 && parts[2]) {
      importedQsos.push({
        time: new Date().toISOString(),
        callsign: parts[2].toUpperCase(),
        band: parts[3] || "7MHz",
        mode: parts[4] || "SSB",
        rstSent: parts[5] || "59001",
        rstRcvd: parts[6] || "59",
        contest: parts[7] || selectedContest,
        remarks: parts[8] || ""
      });
    }
  });

  if (importedQsos.length === 0) {
    showAlert("解析可能なQSOデータが検出されませんでした。(CSV推奨)", "error");
    return;
  }

  if (mode === "overwrite") {
    qsos = importedQsos;
  } else {
    qsos = [...qsos, ...importedQsos];
  }

  saveToStorage();
  closeImportModal();
  showAlert(`${importedQsos.length}件の交信ログを正常にインポートしました。`, "success");
}

// --- UTILITY TOAST NOTIFICATION ---
function showAlert(msg, type = "info") {
  const box = document.getElementById("alertBox");
  box.textContent = msg;
  box.className = "p-4 rounded-xl text-sm font-medium transition-all shadow-lg border ";
  
  if (type === "success") {
    box.classList.add("bg-green-950", "text-green-300", "border-green-800");
  } else if (type === "error") {
    box.classList.add("bg-red-950", "text-red-300", "border-red-800");
  } else {
    box.classList.add("bg-blue-950", "text-blue-300", "border-blue-800");
  }

  box.classList.remove("hidden");
  setTimeout(() => box.classList.add("hidden"), 3000);
}
</script>
