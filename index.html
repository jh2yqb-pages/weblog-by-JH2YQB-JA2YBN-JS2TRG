<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アマチュア無線コンテストログ (WebLog Contest Console)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    .active-tab {
      background-color: #2563eb !important;
      color: #ffffff !important;
      font-weight: bold;
    }
    .modal-tab-active {
      border-bottom: 2px solid #06b6d4;
      color: #06b6d4;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-cyan-500 selection:text-white">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="text-2xl">📻</span>
        <div>
          <h1 class="text-lg font-bold tracking-wide">WebLog Contest Console</h1>
          <div class="flex items-center gap-2 text-xs">
            <span id="syncStatus" class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-medium">☁️ 未ログイン (ローカル保存)</span>
          </div>
        </div>
      </div>
      <div id="authStatus" class="flex items-center gap-3 text-sm">
        <span id="userInfo" class="hidden text-slate-300">ユーザー: <strong id="userName" class="text-white"></strong></span>
        <button id="loginBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer">Googleでログイン</button>
        <button id="logoutBtn" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-1.5 rounded-lg text-xs font-medium transition border border-slate-700 cursor-pointer">ログアウト</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Alert Box -->
    <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium transition-all shadow-md"></div>

    <!-- Area & Contest Selector Panel -->
    <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">1. エリア・コンテストの選択</h2>
      
      <!-- Area Tabs -->
      <div class="flex flex-wrap gap-1.5 mb-4" id="areaTabs">
        <button onclick="selectArea('national')" id="tab-national" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition active-tab cursor-pointer">全国</button>
        <button onclick="selectArea('1')" id="tab-1" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">1エリア (関東)</button>
        <button onclick="selectArea('2')" id="tab-2" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">2エリア (東海)</button>
        <button onclick="selectArea('3')" id="tab-3" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">3エリア (関西)</button>
        <button onclick="selectArea('4')" id="tab-4" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">4エリア (中国)</button>
        <button onclick="selectArea('5')" id="tab-5" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">5エリア (四国)</button>
        <button onclick="selectArea('6')" id="tab-6" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">6エリア (九州)</button>
        <button onclick="selectArea('7')" id="tab-7" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">7エリア (東北)</button>
        <button onclick="selectArea('8')" id="tab-8" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">8エリア (北海道)</button>
        <button onclick="selectArea('9')" id="tab-9" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">9エリア (北陸)</button>
        <button onclick="selectArea('0')" id="tab-0" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">0エリア (信越)</button>
        <button onclick="selectArea('dx')" id="tab-dx" class="area-tab px-3 py-1.5 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer">DX (海外)</button>
      </div>

      <!-- Contest Dropdown & Hint -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
        <div class="md:col-span-2">
          <label for="contestSelect" class="block text-xs font-semibold text-slate-400 mb-1">対象コンテスト</label>
          <select id="contestSelect" onchange="onContestChange()" class="w-full border border-slate-700 bg-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
          </select>
        </div>
        <div class="bg-blue-950/60 border border-blue-800/80 p-3 rounded-lg text-xs text-blue-200">
          <span class="font-bold block mb-0.5 text-blue-300">コンテストナンバー形式:</span>
          <span id="exchangeHintText">RS(T) + 市郡/都道府県ナンバー</span>
        </div>
      </div>
    </section>

    <!-- Logging Form -->
    <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate-800">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">2. QSOデータ入力</h2>
      <form id="qsoForm" onsubmit="handleSaveQso(event)" class="space-y-4">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
          
          <!-- Callsign -->
          <div class="col-span-2 sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-400 mb-1">相手コールサイン *</label>
            <input type="text" id="callsign" required placeholder="例: JA2YAA" oninput="this.value = this.value.toUpperCase(); checkDupe();" class="w-full border border-slate-700 bg-slate-800 text-white rounded-lg p-2 font-mono text-base uppercase focus:ring-2 focus:ring-blue-500 outline-none">
            <span id="dupeWarning" class="text-xs text-red-400 font-bold hidden">⚠️ DUPE（交信済み）</span>
          </div>

          <!-- Band -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">周波数 (Band)</label>
            <select id="band" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
              <option value="1.9MHz">1.9 MHz</option>
              <option value="3.5MHz">3.5 MHz</option>
              <option value="7MHz" selected>7 MHz</option>
              <option value="14MHz">14 MHz</option>
              <option value="21MHz">21 MHz</option>
              <option value="28MHz">28 MHz</option>
              <option value="50MHz">50 MHz</option>
              <option value="144MHz">144 MHz</option>
              <option value="430MHz">430 MHz</option>
              <option value="1200MHz">1200 MHz</option>
              <option value="2400MHz">2400 MHz</option>
            </select>
          </div>

          <!-- Mode -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">モード (Mode)</label>
            <select id="mode" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
              <option value="CW">CW</option>
              <option value="SSB" selected>SSB</option>
              <option value="FM">FM</option>
              <option value="AM">AM</option>
              <option value="RTTY">RTTY</option>
              <option value="FT8">FT8</option>
              <option value="FT4">FT4</option>
              <option value="D-STAR">D-STAR (DV)</option>
              <option value="C4FM">C4FM</option>
              <option value="DMR">DMR</option>
              <option value="PSK31">PSK31</option>
              <option value="SSTV">SSTV</option>
            </select>
          </div>

          <!-- Sent Exchange (固定 / n+1 選択機能を追加) -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-semibold text-slate-400">送信ナンバー (Sent)</label>
              <div class="flex items-center gap-2 text-[11px] text-slate-300">
                <label class="inline-flex items-center gap-1 cursor-pointer">
                  <input type="radio" name="sentNumberMode" value="fixed" checked onchange="onSentModeChange()" class="accent-cyan-500"> 固定
                </label>
                <label class="inline-flex items-center gap-1 cursor-pointer">
                  <input type="radio" name="sentNumberMode" value="inc" onchange="onSentModeChange()" class="accent-cyan-500"> n+1
                </label>
              </div>
            </div>
            <input type="text" id="rstSent" placeholder="5920M" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <!-- Rcvd Exchange -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">受信ナンバー (Rcvd)</label>
            <input type="text" id="rstRcvd" placeholder="5920M" class="w-full border border-slate-700 bg-slate-800 text-slate-100 rounded-lg p-2 font-mono text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

        </div>

        <div class="flex gap-3 justify-end pt-2">
          <button type="button" onclick="resetForm()" class="px-4 py-2 text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium transition border border-slate-700 cursor-pointer">クリア</button>
          <button type="submit" class="px-6 py-2 text-sm bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-md transition cursor-pointer">QSO登録 (保存)</button>
        </div>
      </form>
    </section>

    <!-- Log List & Actions -->
    <section class="bg-slate-900 p-5 rounded-xl shadow-md border border-slate
